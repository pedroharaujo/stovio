name: AI governance

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-governance.yml"
      - "docs/AI_DEVELOPMENT.md"
      - "docs/README.md"
      - "scripts/validate_ai_governance.py"
      - "tests/repository/test_ai_governance_validator.py"
      - ".gitignore"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "ai/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-governance.yml"
      - "docs/AI_DEVELOPMENT.md"
      - "docs/README.md"
      - "scripts/validate_ai_governance.py"
      - "tests/repository/test_ai_governance_validator.py"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate AI governance files
        run: python scripts/validate_ai_governance.py
