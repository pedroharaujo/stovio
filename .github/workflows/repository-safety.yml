name: Repository safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run pull-request repository foundation gate
        if: github.event_name == 'pull_request'
        env:
          SECRET_SCAN_HISTORY_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: python scripts/check_repository_foundation.py
      - name: Run push repository foundation gate
        if: github.event_name == 'push'
        env:
          SECRET_SCAN_HISTORY_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: python scripts/check_repository_foundation.py
      - name: Run manual repository foundation gate
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_repository_foundation.py
